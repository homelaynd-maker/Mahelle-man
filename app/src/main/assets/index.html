<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>بازارچه ۲.۰</title><style>
:root{--p:#0e7c6b;--bg:#f5f7f7;--card:#fff;--txt:#17201f}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:14px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #0002}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:var(--p);color:#fff}button.alt{background:#e8eeee;color:#17302c}.wrap{padding:12px;max-width:1000px;margin:auto}.search{width:100%;padding:13px;border:1px solid #ccd6d4;border-radius:14px;background:#fff}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0}.chip{white-space:nowrap}.chip.on{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 2px 10px #00000010}.emoji{font-size:45px;text-align:center;padding:8px}.price{font-weight:bold;color:var(--p);margin-top:6px}.fab{position:fixed;left:14px;bottom:14px;border-radius:50%;width:54px;height:54px;font-size:20px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap}.row{display:flex;gap:8px;align-items:center}.field{width:100%;padding:11px;border:1px solid #ccd6d4;border-radius:10px;margin:5px 0}.item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}.small{font-size:12px;color:#65716f}.danger{background:#c62828}.preview{max-width:100%;border-radius:12px;margin-top:8px}.code{min-height:180px;direction:ltr;text-align:left;font-family:monospace}.themeBtn{width:45px;height:40px;border-radius:10px}.hidden{display:none}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><b id="brand">🛍️ بازارچه</b><button onclick="openAdmin()">⚙️ مدیریت</button></header><main class="wrap"><input id="q" class="search" placeholder="جستجوی آگهی" oninput="render()"><div id="cats" class="chips"></div><div id="ads" class="grid"></div></main><button class="fab" onclick="toggleMusic()">🔊</button>
<div id="modal" class="modal" onclick="if(event.target===this)closeAdmin()"><div class="sheet"><div class="row"><h2 style="flex:1">پنل مدیریت ۲.۰</h2><button class="alt" onclick="closeAdmin()">بستن</button></div><div id="login"><p>رمز مدیریت را وارد کنید.</p><input id="pass" type="password" class="field" placeholder="رمز مدیریت"><button onclick="login()">ورود</button></div><div id="panel" class="hidden"><div id="tabs" class="tabs"></div><div id="body"></div></div></div></div>
<script>
const defaults={cats:[['vehicle','وسایل نقلیه','🚗'],['realestate','املاک','🏠'],['digital','دیجیتال','📱'],['home','خانه و آشپزخانه','🛋️'],['personal','پوشاک','👕'],['services','خدمات','🛠️'],['jobs','استخدام','💼']],ads:[['🚗','پژو ۲۰۶ تیپ ۲','۴۸۰٬۰۰۰٬۰۰۰'],['🏠','آپارتمان ۷۰ متری','اجاره: ۱۵ / ۸ میلیون'],['📱','گوشی سامسونگ A54','۱۱٬۲۰۰٬۰۰۰'],['🛋️','مبل راحتی ۷ نفره','۲۲٬۰۰۰٬۰۰۰'],['🧥','کاپشن چرم مردانه','۱٬۸۵۰٬۰۰۰'],['🛠️','نقاشی ساختمان','توافقی']]};
let db=JSON.parse(localStorage.bazaar2||'null')||{...defaults,brand:'🛍️ بازارچه',theme:'#0e7c6b',banner:'',music:'',musicOn:false,games:[],pass:'admin123'};let tab=0;
function save(){localStorage.bazaar2=JSON.stringify(db)}function render(){document.documentElement.style.setProperty('--p',db.theme);document.getElementById('brand').textContent=db.brand;let q=(document.getElementById('q').value||'').trim();document.getElementById('cats').innerHTML='<button class="chip on">همه</button>'+db.cats.map(x=>`<button class="chip">${x[2]} ${x[1]}</button>`).join('');document.getElementById('ads').innerHTML=db.ads.filter(a=>a[1].includes(q)).map(a=>`<div class="card"><div class="emoji">${a[0]}</div><b>${a[1]}</b><div class="price">${a[2]}</div></div>`).join('')}render();
function openAdmin(){document.getElementById('modal').style.display='flex';document.getElementById('login').classList.remove('hidden');document.getElementById('panel').classList.add('hidden')}function closeAdmin(){document.getElementById('modal').style.display='none'}function login(){if(document.getElementById('pass').value!==db.pass){alert('رمز اشتباه است');return}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');showPanel()}
const names=['کلیات','دسته‌بندی','آگهی‌ها','فروشندگان','بازی‌ها','بنر','آهنگ','ظاهر برنامه','زبان‌های برنامه‌نویسی','امنیت'];function showPanel(){document.getElementById('tabs').innerHTML=names.map((n,i)=>`<button class="${i===tab?'':'alt'}" onclick="tab=${i};showPanel()">${n}</button>`).join('');let b=document.getElementById('body');b.innerHTML=[general,categories,listings,sellers,games,banner,audio,appearance,languages,security][tab]()}function general(){return `<div class="card"><h3>بازارچه ۲.۰</h3><p>نسخه Android Native + WebView. اطلاعات تنظیمات این نسخه در حافظه محلی برنامه ذخیره می‌شود.</p><button onclick="db.pass='admin123';save();alert('رمز به مقدار پیش‌فرض برگشت')">بازنشانی رمز</button></div>`}function categories(){return `<button onclick="addCat()">➕ دسته جدید</button><div>${db.cats.map((x,i)=>`<div class=item><span>${x[2]} ${x[1]}</span><span><button class="alt" onclick="editCat(${i})">ویرایش</button> <button class="danger" onclick="delCat(${i})">حذف</button></span></div>`).join('')}</div>`}function addCat(){let n=prompt('نام دسته');if(n){db.cats.push(['c'+Date.now(),n,'📦']);save();showPanel();render()}}function editCat(i){let n=prompt('نام جدید',db.cats[i][1]);if(n){db.cats[i][1]=n;save();showPanel();render()}}function delCat(i){if(confirm('حذف شود؟')){db.cats.splice(i,1);save();showPanel();render()}}function listings(){return `<p>آگهی‌های نمونه:</p>`+db.ads.map(a=>`<div class=item>${a[0]} ${a[1]} — ${a[2]}</div>`).join('')}function sellers(){return `<div class=card><b>مدیریت فروشندگان</b><p class=small>حساب‌های واقعی و چت بین دستگاه‌ها برای نسخه عملیاتی نیازمند Backend است.</p></div>`}function games(){return `<h3>بازی سفارشی</h3><textarea id="gamecode" class="field code" placeholder="کد HTML/CSS/JS"></textarea><button onclick="testGame()">▶️ تست</button> <button onclick="saveGame()">ذخیره بازی</button><div>${db.games.map((g,i)=>`<div class=item>${g.name}<button class="danger" onclick="db.games.splice(${i},1);save();showPanel()">حذف</button></div>`).join('')}</div>`}function testGame(){let c=document.getElementById('gamecode').value;let w=window.open();if(w)w.document.write(c)}function saveGame(){let c=document.getElementById('gamecode').value,n=prompt('نام بازی','بازی جدید');if(c&&n){db.games.push({name:n,code:c});save();showPanel()}}function banner(){return `<h3>بنر تبلیغاتی</h3><input type=file accept="image/*" onchange="fileToBanner(this)"><img id="bp" class="preview" src="${db.banner}">${db.banner?'<button class="danger" onclick="db.banner="";save();showPanel()">حذف بنر</button>':''}`}function fileToBanner(i){let f=i.files[0],r=new FileReader();r.onload=()=>{db.banner=r.result;save();showPanel()};if(f)r.readAsDataURL(f)}function audio(){return `<h3>آهنگ</h3><input type=file accept="audio/*" onchange="fileToAudio(this)"><label><input type=checkbox ${db.musicOn?'checked':''} onchange="db.musicOn=this.checked;save()"> پخش آهنگ فعال باشد</label>${db.music?'<audio controls src="'+db.music+'"></audio>':''}`}function fileToAudio(i){let f=i.files[0],r=new FileReader();r.onload=()=>{db.music=r.result;save();showPanel()};if(f)r.readAsDataURL(f)}function appearance(){return `<h3>ظاهر و برند</h3><input class=field value="${db.brand}" onchange="db.brand=this.value;save();render()"><div class=row>${['#0e7c6b','#1565c0','#6a1b9a','#ef6c00','#c62828','#2e7d32'].map(c=>`<button class=themeBtn style="background:${c}" onclick="db.theme='${c}';save();render()"></button>`).join('')}</div>`}function languages(){return `<h3>زبان‌های برنامه‌نویسی</h3>${['JavaScript','Python','C','C++','Java','C#','PHP','TypeScript','Go','Rust'].map(x=>`<div class=item>${x}<span class=small>Runner امن Backend برای اجرای واقعی لازم است</span></div>`).join('')}`}function security(){return `<h3>امنیت</h3><p>رمز پیش‌فرض نسخه آزمایشی: admin123</p><p class=small>برای انتشار عمومی، رمز و احراز هویت باید در Backend امن پیاده‌سازی شود.</p>`}function toggleMusic(){db.musicOn=!db.musicOn;save();alert(db.musicOn?'پخش آهنگ فعال شد':'پخش آهنگ غیرفعال شد')}
</script></body></html>
